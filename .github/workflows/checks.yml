name: Reliability checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      USERS_DATA_DIR: /tmp/shaka-ci-data
      DATA_DIR: /tmp/shaka-ci-data
      AUTH_SECRET: ci-only-not-a-deployment-secret
      AGENT_TOKEN: ci-only-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run check
      - run: npm run build
